name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Сгенерировать проект Xcode
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Автотесты на симуляторе
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          ids = [d['udid'] for runtime, devices in data.items() if 'iOS' in runtime for d in devices if d['name'].startswith('iPhone')]
          print(ids[-1] if ids else '')
          ")
          echo "Симулятор: $DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          set -o pipefail
          xcodebuild test \
            -project Prosnis.xcodeproj \
            -scheme Prosnis \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | { grep -E ': error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)' || true; }

      - name: Собрать без подписи
        run: |
          set -o pipefail
          xcodebuild \
            -project Prosnis.xcodeproj \
            -scheme Prosnis \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | { grep -E ': error:|BUILD (SUCCEEDED|FAILED)' || true; }

      - name: Упаковать в .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Prosnis.app Payload/
          zip -qr Prosnis.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Prosnis-ipa
          path: Prosnis.ipa

      - name: Скриншоты экранов в симуляторе
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          APP=$(find build-tests/Build/Products -path "*iphonesimulator*" -name "Prosnis.app" | head -1)
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time "6:30" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEVICE_ID" "$APP"
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$DEVICE_ID" app.prosnis.alarm 2>/dev/null || true
            xcrun simctl launch "$DEVICE_ID" app.prosnis.alarm "$@"
            sleep 15
            xcrun simctl io "$DEVICE_ID" screenshot "shots/$NAME.png"
          }
          NAME=garden; shoot -gardenPreview
          NAME=alarms; shoot -screenshotTab 0
          NAME=progress; shoot -screenshotTab 1
          NAME=community; shoot -screenshotTab 2
          NAME=profile; shoot -screenshotTab 3
          NAME=meds; shoot -screenshotTab 4
          NAME=prayer; shoot -screenshotScreen prayer
          NAME=charge; shoot -screenshotScreen charge
          cd shots
          git init -q
          git checkout -q -b ci-screens
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add *.png
          git commit -qm "Скриншоты для ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screens

      - name: Итоги тестов и предупреждений
        if: always()
        run: |
          if [ -f test.log ]; then
            summary=$(grep -E "Executed [0-9]+ tests" test.log | tail -1 | sed 's/%/%25/g')
            echo "::notice title=Тесты::${summary:-нет данных}"
            failed=$(grep -E "error: -\[|Test Case .* failed" test.log | sed -E 's#^.*/(Prosnis|ProsnisTests)/#\1/#' | sort -u | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if [ -n "$failed" ]; then echo "::error title=Упавшие тесты::${failed}"; fi
          fi
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            count=$(grep -E ": warning:" "$f" | grep -E "/(Prosnis|ProsnisTests)/" | sed -E 's#^.*/(Prosnis|ProsnisTests)/#\1/#' | sort -u | wc -l | tr -d ' ')
            list=$(grep -E ": warning:" "$f" | grep -E "/(Prosnis|ProsnisTests)/" | sed -E 's#^.*/(Prosnis|ProsnisTests)/#\1/#' | sort -u | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Предупреждения ${f} (${count})::${list:-нет}"
          done

      - name: Ошибки в аннотацию
        if: failure()
        run: |
          if [ -f xcodegen.log ] && ! grep -q "Created project" xcodegen.log; then
            msg=$(tail -20 xcodegen.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=XcodeGen::${msg}"
          fi
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E ': error:' "$f" | sed -E 's#^.*/(Prosnis|ProsnisTests)/#\1/#' | sort -u | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            if [ -n "$msg" ]; then echo "::error title=Ошибки ${f}::${msg}"; fi
          done
