openapi: 3.0.3
info:
  title: Проснись — API сервера
  version: "1.0"
  description: |
    Договор между приложением и будущим сервером. Приложение уже отправляет и принимает
    данные в этом формате (Prosnis/Social/HTTPBackend.swift). Чтобы подключить сервер,
    достаточно реализовать эти методы и указать адрес в AppConfig.serverURL.

    Правила, которые сервер обязан соблюдать:
    - Даты в формате ISO 8601 (UTC).
    - Ставки, суммы, журнал и платежи никогда не отдаются другим пользователям.
    - Статус друга фильтруется по его настройкам видимости (Visibility) для конкретного зрителя.
    - Данные о намазе (isPrayer, модуль prayer) приходят только с согласия пользователя
      и не показываются никому без поля sharePrayer. Когда в приватности приходит
      syncPrayerData = false, сервер обязан удалить все уже сохранённые данные о намазе.
    - Рекорды и таблицы считаются на сервере по журналу (ProgressEngine — та же формула),
      значения от клиента не принимаются на веру.
    - Данные граждан РФ хранятся на серверах в РФ.
    - Автоматического возврата по спору нет: каждый спор рассматривается по журналу и событиям утра.
      Решение сервер присылает приложению; при решении в пользу человека делается возврат.
    - Будильник по Фаджру или календарю, не поставленный потому, что приложение не открывали дольше 10 дней,
      — провал со списанием (об этом сказано в условиях ставки, версия 3).
    - 401 означает «токен недействителен»: приложение забывает токен и заново проходит /v1/auth/register.

    Списание ставки делает сервер, по таймеру, без участия приложения:
    - За 2 часа до звонка будильника со ставкой сервер блокирует сумму у платёжного сервиса.
      Если блокировка не прошла (нет денег), человек получает уведомление вечером.
    - Через 10 минут после звонка: сервер не получил «taskDone» в течение этих 10 минут → списание.
      Одного «started» недостаточно: нажать «Выключить» и не выполнить задание — провал.
    - Повторная проверка: окно отсчитывается от момента, когда сервер получил «taskDone» (T):
      «recheckDone» должен прийти в промежутке [T + 10 мин − 20 с, T + 20 мин]. Нет — списание.
      Это так, даже если «taskDone» был: вставший, но не прошедший вторую проверку — провал.
    - Есть «recheckDone» вовремя → блокировка снимается.
    - Очередь: если будильник прозвенел, пока у того же человека шла проверка другого утра,
      его «started» приходит позже. Сервер принимает такой «started», только если в момент звонка
      другое утро было не закончено (по его событиям), и не позже 30 минут после звонка.
      Срок задания тогда — 10 минут от получения этого «started».
    - morningID сервер берёт из события как есть («alarmID|секунды времени звонка») и не пересчитывает.
      Если событий нет, время звонка считается по расписанию будильника. После смены часового пояса
      у одного дня будильника может быть два времени — списание не больше одного за день. Время, известное
      серверу раньше чем за 2 часа до звонка, обязательное; пояс, сменённый в последние 2 часа,
      может сдвинуть утро только на раньше, но не на позже.
    - Ставка действует, только если последнее согласие (OutboxItem kind=consent) имеет текущую версию
      условий (3) и maxAmount не меньше суммы ставки. Без такого согласия сервер не блокирует и не списывает.
    - Событие «technical» — приложение сообщает о сбое системы (повторный звонок не поставился):
      блокировка снимается без списания, утро помечается. Частые такие события у одного человека
      рассматриваются вручную.
    - Одно утро (morningID) — одно решение. Повторные события ничего не меняют, двойного списания нет.
    - Прощений нет. Не списывается только сбой не по вине человека: будильник не был поставлен
      из-за сбоя приложения или телефона, или сам сервер был недоступен в окне проверки этого утра
      (тогда утро записывается как сбой системы).
    - Решающее время события — момент его получения сервером, а не поле at от телефона.
      Утро успешно, только если «started»/«taskDone» и «recheckDone» пришли на сервер в реальном времени
      внутри своих 10-минутных окон.
    - Поздние события (утром не было сети) НЕ возвращают деньги автоматически: секрет подписи хранится
      на телефоне, его можно извлечь и подделать событие с нужным временем. Такие события прикладываются
      к спору, спор рассматривается вручную.
    - Автоматический возврат по поздним событиям допускается только с аппаратной защитой: App Attest
      (ключ в Secure Enclave, не извлекается), одноразовый код от сервера, выданный до звонка, и проверка
      счётчика утверждений. Подпись HMAC секретом устройства служит только для целостности, не для доказательства времени.
    - Согласие с условиями ставки (OutboxItem kind=consent) хранится как доказательство для споров.

    Повторная проверка и парные челленджи:
    - У будильника со ставкой повторная проверка обязательна. Без ставки — по выбору человека
      (поле alarm.recheckEnabled), по умолчанию выключена.
    - В записи журнала поле rechecked: true — утро с повторной проверкой, false — без неё, нет поля — старые записи.
    - Утро без повторной проверки (только без ставки) заканчивается событием «doneNoRecheck» вместо «recheckDone».
      Для будильника со ставкой «doneNoRecheck» ничего не значит: там нужен «recheckDone» вовремя.
    - Парный челлендж засчитывает только утра с rechecked != false: соревнование должно быть честным.
      Дерево, опыт и личный прогресс растут от любого успешного утра.

    Обещания по шагам:
    - Запись журнала с promise=true — обещание («в 22:00 иду бегать, не меньше N шагов до 23:30»), а не подъём:
      в серию, дерево, статус друзьям, челленджи и статистику утр оно не входит. Списание по нему учитывается в деньгах.
    - Шаги считает телефон (CMPedometer), поэтому итог проверить на сервере нельзя. Автоматическое списание по такому итогу
      допускается только с аппаратной защитой (App Attest), иначе — как поздние события: на ручной спор.
    - Если шаги не проверили в течение 6 дней после окна, обещание считается невыполненным (телефон хранит данные неделю).

    Общие сады:
    - В саду до 5 человек. Участник видит у других только «полил сегодня» и число поливов — без времени и денег.
    - POST /v1/me/water поливает все сады человека: один полив на человека в день (день по его часам).
      Рост сада: +1 за полив и ещё +1, когда сад в этот день полили все участники.
    - wateredToday сбрасывается для каждого участника с началом его нового дня.
    - Утро с намазом поливает сад, только если у человека включено sharePrayer (приложение не отправит полив иначе).
servers:
  - url: https://api.example.ru
security:
  - bearer: []
paths:
  /v1/auth/register:
    post:
      summary: Регистрация устройства без пароля, телефона и почты
      description: |
        Приложение создаёт код восстановления из 16 слов (128 бит, RecoveryPhrase) и выводит из него userID
        и секрет через PBKDF2-SHA256 (100 000 повторов) разными путями: по userID секрет не восстановить.
        Первый вызов создаёт пользователя с этим userID и выдаёт ему номер для друзей; повторный с тем же
        секретом возвращает новый токен для того же пользователя; с другим секретом — 403.
        restore=true — восстановление по коду на новом телефоне: если такого userID нет, 404 и новый аккаунт не создаётся.
        Сервер хранит не сам секрет, а его хеш, и ограничивает число попыток с одного адреса.
        Номер для друзей: 9 случайных цифр (PRO-XXX-XXX-XXX), уникальный, выдаётся не по порядку.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userID: { type: string, format: uuid }
                secret: { type: string }
                displayName: { type: string }
                avatar: { type: string }
                restore: { type: boolean, nullable: true }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string }, number: { type: string, description: "PRO-XXX-XXX-XXX" } } } } } }
        "403": { description: Секрет не совпал }
        "404": { description: При restore=true такого аккаунта нет }
  /v1/me/backup:
    get:
      summary: Данные аккаунта для восстановления на новом телефоне (профиль, приватность, будильники, дневник, челленджи)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { alarms: { type: array, items: { type: object } }, journal: { type: array, items: { type: object } }, challenges: { type: array, items: { type: object } } } } } } } }
  /v1/friend-requests:
    get:
      summary: Входящие заявки в друзья
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, from: { $ref: "#/components/schemas/UserProfile" }, sentAt: { type: string, format: date-time } } } } } } } }
    post:
      summary: Заявка по номеру. Дружба начинается только после принятия. Не больше 20 заявок в сутки; после отказа — повтор тому же человеку не раньше чем через 30 дней; от заблокировавшего — не доставляется; 404 — номера нет
      requestBody: { content: { application/json: { schema: { type: object, properties: { number: { type: string } } } } } }
      responses: { "200": { description: OK } }
  /v1/friend-requests/{id}/accept:
    post:
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "200": { description: Новый друг, content: { application/json: { schema: { $ref: "#/components/schemas/Friend" } } } } }
  /v1/friend-requests/{id}/decline:
    post:
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "200": { description: OK } }
  /v1/time:
    get:
      summary: Время сервера. Приложение сверяет по нему защищённое время для блокировки ставки за 2 часа
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { now: { type: string, format: date-time } } } } } }
  /v1/sync:
    post:
      summary: Отправка очереди изменений (будильники, журнал, челленджи, приватность, профиль)
      requestBody:
        content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OutboxItem" } } } }
      responses:
        "200": { description: Принятые id, content: { application/json: { schema: { type: object, properties: { accepted: { type: array, items: { type: string, format: uuid } } } } } } }
  /v1/me:
    delete:
      summary: Удалить аккаунт и все данные
      responses: { "204": { description: Удалено } }
  /v1/me/status:
    put:
      summary: Статус дня для друзей
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/PublicStatus" } } } }
      responses: { "204": { description: OK } }
  /v1/me/missed:
    post:
      summary: Я проспал — разослать уведомление друзьям-свидетелям
      description: |
        Только день («гггг-мм-дд»). Сервер не сообщает свидетелям ни время, ни сумму ставки.
        Сервер обязан: отправлять только тем из списка, кто сейчас принятый друг и не заблокирован
        (в любую сторону); не больше одного уведомления на пару «отправитель — свидетель» в сутки;
        доставлять в фиксированное время или пачкой, чтобы момент уведомления не выдавал время звонка.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/MissedMorningNotice" } } } }
      responses: { "204": { description: OK } }
  /v1/gardens:
    get:
      summary: Мои общие сады
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SharedGarden" } } } } } }
    post:
      summary: Посадить сад (я — владелец)
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, species: { type: string, enum: [oak, sakura, pine, birch, maple, palm] } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SharedGarden" } } } } }
  /v1/gardens/join:
    post:
      summary: Войти в сад по коду. 409 — в саду уже 5 человек, 422 — код не подошёл
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CodeBody" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SharedGarden" } } } } }
  /v1/gardens/{id}/leave:
    post:
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "200": { description: OK } }
  /v1/me/water:
    post:
      summary: Успешное утро поливает все мои сады. Повтор за тот же день ничего не меняет
      requestBody: { content: { application/json: { schema: { type: object, properties: { day: { type: string, format: date } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SharedGarden" } } } } } }
  /v1/witness-notices:
    get:
      summary: Друзья, у которых я свидетель и которые недавно проспали
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WitnessNotice" } } } } } }
  /v1/me/rewards:
    get:
      summary: Награды за приглашения
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/InviteReward" } } } } } }
  /v1/friends:
    get:
      summary: Список друзей со статусами, отфильтрованными по их видимости
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Friend" } } } } } }
  /v1/friends/{id}:
    delete:
      summary: Удалить из друзей
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "204": { description: OK } }
  /v1/friends/{id}/visibility:
    put:
      summary: Что видит этот друг
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Visibility" } } } }
      responses: { "204": { description: OK } }
  /v1/friends/{id}/nudge:
    post:
      summary: «Разбудить» друга (не больше 3 раз в сутки, иначе 429)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "204": { description: OK }, "429": { description: Лимит } }
  /v1/invites:
    post:
      summary: Создать код приглашения (6 символов, 7 дней)
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invite" } } } } }
  /v1/invites/accept:
    post:
      summary: Принять приглашение по коду
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CodeBody" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Friend" } } } }, "422": { description: Неверный код } }
  /v1/rooms:
    get:
      summary: Комнаты и клубы пользователя
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Room" } } } } } }
    post:
      summary: Создать комнату или клуб
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/RoomDraft" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Room" } } } } }
  /v1/rooms/join:
    post:
      summary: Войти по коду (409 — комната заполнена, 30 участников)
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CodeBody" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Room" } } } }, "409": { description: Заполнена }, "422": { description: Неверный код } }
  /v1/rooms/{id}/leave:
    post:
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "204": { description: OK } }
  /v1/conversations/{kind}/{id}/messages:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [friend, room] } }
      - { $ref: "#/components/parameters/id" }
    get:
      summary: Сообщения (без заблокированных авторов)
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } } } } } }
    post:
      summary: Отправить сообщение (до 1000 символов, модерация на сервере, только 18+)
      requestBody: { content: { application/json: { schema: { type: object, properties: { text: { type: string, maxLength: 1000 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } } }
  /v1/messages/{id}/report:
    post:
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } } }
      responses: { "204": { description: OK } }
  /v1/users/{id}/block:
    post:
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses: { "204": { description: OK } }
  /v1/leaderboards/{kind}:
    get:
      summary: Таблица (только участники с joinLeaderboards); рекорд держится, пока не побит
      parameters: [ { name: kind, in: path, required: true, schema: { type: string, enum: [weekRegularity, allTimeStreak, allTimeWakes] } } ]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Leaderboard" } } } } }
  /v1/stats/global:
    get:
      summary: Анонимная статистика
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GlobalStats" } } } } }
  /v1/pair-challenges:
    get:
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PairChallenge" } } } } } }
    post:
      requestBody: { content: { application/json: { schema: { type: object, properties: { friendID: { type: string, format: uuid }, title: { type: string }, days: { type: integer } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PairChallenge" } } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    CodeBody: { type: object, properties: { code: { type: string, minLength: 6, maxLength: 6 } } }
    UserProfile:
      type: object
      properties: { id: { type: string, format: uuid }, displayName: { type: string }, avatar: { type: string } }
    Visibility:
      type: object
      properties: { wakeStatus: { type: boolean }, wakeTime: { type: boolean }, streak: { type: boolean }, level: { type: boolean }, tree: { type: boolean }, prayer: { type: boolean } }
    PublicStatus:
      type: object
      description: Без каких-либо денежных полей.
      properties:
        day: { type: string, format: date-time }
        woke: { type: boolean, nullable: true }
        wakeTime: { type: string, format: date-time, nullable: true }
        streak: { type: integer, nullable: true }
        level: { type: integer, nullable: true }
        treeStage: { type: integer, nullable: true, description: "Стадия текущего дерева 0–7; каждые 100 удачных утр дерево уходит в сад и стадия начинается заново" }
        treeSpecies: { type: string, nullable: true, enum: [oak, sakura, pine, birch, maple, palm] }
        prayerDone: { type: boolean, nullable: true }
    Friend:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/UserProfile" }
        since: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/PublicStatus" }
        myVisibility: { $ref: "#/components/schemas/Visibility" }
    Invite: { type: object, properties: { code: { type: string }, expiresAt: { type: string, format: date-time } } }
    RoomMember:
      type: object
      properties: { profile: { $ref: "#/components/schemas/UserProfile" }, status: { $ref: "#/components/schemas/PublicStatus" }, isOwner: { type: boolean } }
    Room:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isClub: { type: boolean }
        topic: { type: string, nullable: true }
        rules: { type: string, nullable: true }
        targetWakeMinutes: { type: integer, nullable: true }
        inviteCode: { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/RoomMember" } }
        createdAt: { type: string, format: date-time }
    RoomDraft:
      type: object
      properties: { name: { type: string }, isClub: { type: boolean }, topic: { type: string, nullable: true }, rules: { type: string, nullable: true }, targetWakeMinutes: { type: integer, nullable: true } }
    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversation: { type: object, properties: { kind: { type: string, enum: [friend, room] }, id: { type: string, format: uuid } } }
        author: { $ref: "#/components/schemas/UserProfile" }
        text: { type: string }
        sentAt: { type: string, format: date-time }
    LeaderboardRow:
      type: object
      properties: { rank: { type: integer }, profile: { $ref: "#/components/schemas/UserProfile" }, value: { type: integer }, valueText: { type: string } }
    Leaderboard:
      type: object
      properties:
        kind: { type: string }
        rows: { type: array, items: { $ref: "#/components/schemas/LeaderboardRow" } }
        me: { $ref: "#/components/schemas/LeaderboardRow" }
        record: { type: object, properties: { profile: { $ref: "#/components/schemas/UserProfile" }, value: { type: integer }, since: { type: string, format: date-time } } }
    GlobalStats: { type: object, properties: { wokeToday: { type: integer }, activeChallenges: { type: integer } } }
    WakeEvent:
      type: object
      description: Событие утра (payload у OutboxItem kind=wakeEvent).
      properties:
        id: { type: string, format: uuid }
        morningID: { type: string, description: "«alarmID|секунды времени звонка»" }
        alarmID: { type: string, format: uuid }
        ring: { type: string, format: date-time }
        kind: { type: string, enum: [started, taskDone, recheckDone, failed, technical, doneNoRecheck] }
        at: { type: string, format: date-time, description: "По защищённым часам телефона. Только для справки: решающее время — момент получения сервером" }
        signature: { type: string, description: "base64 HMAC-SHA256 строки «morningID|kind|секунды at»" }
    StakeConsent:
      type: object
      description: Согласие с условиями ставки (payload у OutboxItem kind=consent).
      properties:
        version: { type: integer }
        acceptedAt: { type: string, format: date-time }
        maxAmount: { type: integer }
    MissedMorningNotice:
      type: object
      properties:
        day: { type: string, format: date, description: "День по часам отправителя, без часового пояса" }
        witnesses: { type: array, items: { type: string, format: uuid } }
    WitnessNotice:
      type: object
      properties:
        id: { type: string, format: uuid }
        friend: { $ref: "#/components/schemas/UserProfile" }
        day: { type: string, format: date }
    SharedGarden:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        species: { type: string, enum: [oak, sakura, pine, birch, maple, palm] }
        inviteCode: { type: string }
        growth: { type: integer }
        createdAt: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            properties:
              profile: { $ref: "#/components/schemas/UserProfile" }
              wateredToday: { type: boolean }
              waterings: { type: integer }
              isOwner: { type: boolean }
    InviteReward: { type: object, properties: { id: { type: string }, title: { type: string }, detail: { type: string }, unlocked: { type: boolean } } }
    PairChallenge:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        partner: { $ref: "#/components/schemas/UserProfile" }
        durationDays: { type: integer }
        startDate: { type: string, format: date-time }
        myDays: { type: integer }
        partnerDays: { type: integer }
        status: { type: string, enum: [active, completed, failed, abandoned] }
    OutboxItem:
      type: object
      description: payload — JSON сущности в base64 (будильник, запись журнала, челлендж, приватность, профиль).
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [alarm, journalEntry, challenge, privacy, profile, wakeEvent, consent] }
        entityID: { type: string, format: uuid }
        payload: { type: string, format: byte }
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        isSensitive: { type: boolean, nullable: true, description: "Данные о намазе: хранить отдельно, удалить при отзыве согласия" }
